<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="赤尾红科技性格测试 — 40道内心选择，找到专属于你的赤尾款式。科技让爱更贴近。">
<title>赤尾红科技 — 找到你的灵魂之选</title>
<style>
/* ═══════════════════════════════════════════
   RESET & FONTS
   ═══════════════════════════════════════════ */
/* Google Fonts disabled for offline-first; system font stack used instead */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --red:#D4213D; --red-bright:#E83952; --red-deep:#9B1028; --red-glow:rgba(212,33,61,0.3);
  --gold:#C9A96E; --gold-light:#DFC896; --gold-glow:rgba(201,169,110,0.2);
  --bg:#0D0D0D; --bg-elevated:#161616; --bg-card:#1C1C1E;
  --text:#F2F2F2; --text-muted:#999; --text-dim:#666;
  --radius-xl:24px; --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
  --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
  --ease-out-back:cubic-bezier(0.34,1.56,0.64,1);
  --ease-spring:cubic-bezier(0.22,1.2,0.36,1);
}

html{font-size:16px;scroll-behavior:smooth;background:var(--bg)}
body{
  font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;
  display:flex;justify-content:center;align-items:flex-start;
  padding:20px 16px 60px;line-height:1.65;
  -webkit-tap-highlight-color:transparent;user-select:none;
  overflow-x:hidden;
}

/* ═══════════════════════════════════════════
   ANIMATED BACKGROUND
   ═══════════════════════════════════════════ */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%,rgba(212,33,61,0.06) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 20% 80%,rgba(201,169,110,0.04) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 20%,rgba(212,33,61,0.03) 0%,transparent 50%);
}
.bg-orb{
  position:fixed;pointer-events:none;z-index:0;border-radius:50%;filter:blur(80px);opacity:0.5;
}
.bg-orb.orb-1{width:320px;height:320px;background:rgba(212,33,61,0.07);top:-80px;left:-60px;animation:orb-float 12s ease-in-out infinite}
.bg-orb.orb-2{width:240px;height:240px;background:rgba(201,169,110,0.05);bottom:-40px;right:-40px;animation:orb-float 15s ease-in-out infinite reverse}
@keyframes orb-float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.1)}66%{transform:translate(-20px,15px) scale(0.9)}}

/* ═══════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════ */
.container{width:100%;max-width:520px;position:relative;z-index:1;padding:10px 0 40px}

/* ═══════════════════════════════════════════
   WELCOME SCREEN
   ═══════════════════════════════════════════ */
.welcome{text-align:center;padding-top:clamp(40px,10vh,80px)}
.welcome .logo-wrap{position:relative;display:inline-block;margin-bottom:32px}
.welcome .logo-ring{
  width:100px;height:100px;position:relative;margin:0 auto;
  display:flex;align-items:center;justify-content:center;
}
.welcome .logo-ring::before{
  content:'';position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--red),var(--gold),var(--red));
  animation:logo-spin 3s linear infinite;
}
.welcome .logo-ring::after{
  content:'';position:absolute;inset:3px;border-radius:50%;background:var(--bg);
}
.welcome .logo-inner{
  position:relative;z-index:1;width:82px;height:82px;border-radius:50%;
  background:linear-gradient(135deg,var(--red-deep),var(--red),var(--red-bright));
  display:flex;align-items:center;justify-content:center;
  font-size:38px;font-weight:900;color:#fff;letter-spacing:2px;
  box-shadow:0 0 60px var(--red-glow),inset 0 1px 0 rgba(255,255,255,0.2);
}
@keyframes logo-spin{to{transform:rotate(360deg)}}
.welcome .logo-dot{
  position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 8px var(--gold-glow);
  animation:dot-pulse 2s ease-in-out infinite;
}
.welcome .logo-dot:nth-child(2){top:10px;right:18px;animation-delay:0s}
.welcome .logo-dot:nth-child(3){bottom:14px;left:10px;animation-delay:0.7s}
.welcome .logo-dot:nth-child(4){top:20px;left:14px;animation-delay:1.4s}
@keyframes dot-pulse{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1.4)}}

.welcome h1{
  font-size:clamp(1.6rem,4vw,2.1rem);font-weight:900;letter-spacing:3px;line-height:1.3;
  background:linear-gradient(135deg,var(--red-bright) 0%,var(--red) 40%,var(--gold-light) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:16px;
  animation:fadeInUp 0.8s var(--ease-out-expo) forwards;
}
.welcome .tagline{
  font-size:0.85rem;font-weight:500;letter-spacing:4px;text-transform:uppercase;
  color:var(--gold);margin-bottom:28px;opacity:0;
  animation:fadeInUp 0.8s 0.15s var(--ease-out-expo) forwards;
}
.welcome .subtitle{
  font-size:0.95rem;color:var(--text-muted);line-height:1.8;margin-bottom:8px;
  opacity:0;animation:fadeInUp 0.8s 0.25s var(--ease-out-expo) forwards;
}
.welcome .subtitle em{color:var(--gold);font-style:normal;font-weight:500}

.btn-start{
  position:relative;display:inline-flex;align-items:center;gap:10px;
  margin-top:40px;padding:17px 52px;
  font-family:inherit;font-size:1.05rem;font-weight:700;letter-spacing:2px;
  color:#fff;background:linear-gradient(135deg,var(--red),var(--red-deep));
  border:none;border-radius:60px;cursor:pointer;
  box-shadow:0 8px 32px var(--red-glow),0 2px 8px rgba(0,0,0,0.3);
  transition:all 0.4s var(--ease-out-expo);
  opacity:0;animation:fadeInUp 0.8s 0.4s var(--ease-out-expo) forwards;
  overflow:hidden;
}
.btn-start::after{
  content:'';position:absolute;inset:0;border-radius:60px;
  background:linear-gradient(135deg,transparent,rgba(255,255,255,0.1),transparent);
  transform:translateX(-100%);transition:transform 0.6s ease;
}
.btn-start:hover::after{transform:translateX(100%)}
.btn-start:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(212,33,61,0.45),0 4px 12px rgba(0,0,0,0.4)}
.btn-start:active{transform:scale(0.95);transition:transform 0.15s ease}
.btn-start:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn-start .arrow{display:inline-block;transition:transform 0.3s var(--ease-out-expo)}
.btn-start:hover .arrow{transform:translateX(4px)}

/* ═══════════════════════════════════════════
   QUIZ AREA
   ═══════════════════════════════════════════ */
.quiz-area{display:none}
.quiz-area.active{display:block;animation:fadeInUp 0.5s var(--ease-out-expo) forwards}

/* ── Progress ── */
.progress-wrap{display:flex;align-items:center;gap:16px;margin-bottom:32px}
.progress-track{flex:1;height:3px;background:rgba(255,255,255,0.08);border-radius:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--red-bright),var(--gold-light));border-radius:10px;transition:width 0.5s var(--ease-out-expo);position:relative}
.progress-fill::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--gold-light);box-shadow:0 0 10px var(--gold-glow)}
.progress-num{font-size:0.8rem;font-weight:600;color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:1px;min-width:42px;text-align:right}
.progress-icon{font-size:1rem;animation:spin-slow 10s linear infinite;opacity:0.6}
@keyframes spin-slow{to{transform:rotate(360deg)}}

/* ── Question Card ── */
.question-card{
  background:var(--bg-card);border-radius:var(--radius-xl);
  padding:clamp(28px,5vw,40px) clamp(22px,4vw,32px);
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:0 4px 24px rgba(0,0,0,0.3),0 1px 0 rgba(255,255,255,0.03) inset;
  position:relative;overflow:hidden;
}
.question-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);
}
.question-number{
  font-size:0.72rem;font-weight:700;letter-spacing:3px;color:var(--text-dim);
  text-align:center;margin-bottom:20px;text-transform:uppercase;
}
.question-text{
  font-size:clamp(1.08rem,2.5vw,1.22rem);font-weight:600;line-height:1.75;
  text-align:center;margin-bottom:32px;color:var(--text);
}

.options{display:flex;flex-direction:column;gap:12px}
.option-btn{
  position:relative;display:flex;align-items:center;width:100%;padding:17px 20px;
  font-family:inherit;font-size:0.95rem;text-align:left;color:var(--text);
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--radius-md);cursor:pointer;
  transition:all 0.3s var(--ease-out-expo);overflow:hidden;
}
.option-btn::before{
  content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--red),var(--red-deep));
  opacity:0;transition:opacity 0.3s ease;z-index:0;
}
.option-btn:hover{border-color:rgba(212,33,61,0.5);transform:translateX(4px);background:rgba(255,255,255,0.05)}
.option-btn:active{transform:scale(0.98);transition:transform 0.12s ease}
.option-btn:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-color:var(--red)}
.option-btn.selected{border-color:var(--red);background:rgba(212,33,61,0.12)}
.option-btn.selected::before{opacity:0.08}
.option-btn .opt-letter{
  position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:50%;font-size:0.78rem;font-weight:700;
  background:rgba(255,255,255,0.06);color:var(--text-muted);
  margin-right:14px;flex-shrink:0;transition:all 0.3s ease;
}
.option-btn.selected .opt-letter{background:var(--red);color:#fff;box-shadow:0 0 12px var(--red-glow)}
.option-btn .opt-text{position:relative;z-index:1;flex:1}

/* ── Ripple ── */
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,0.15);transform:scale(0);animation:ripple-effect 0.6s ease-out forwards;pointer-events:none}
@keyframes ripple-effect{to{transform:scale(4);opacity:0}}

/* ═══════════════════════════════════════════
   RESULT AREA
   ═══════════════════════════════════════════ */
.result-area{display:none}
.result-area.active{display:block;animation:fadeInUp 0.7s var(--ease-out-expo) forwards}

.result-header{text-align:center;margin-bottom:36px;padding-top:20px}
.result-header .crown{font-size:2rem;display:block;margin-bottom:12px;animation:bounce-in 0.6s 0.2s var(--ease-out-back) both}
@keyframes bounce-in{0%{opacity:0;transform:scale(0.3)}50%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.result-header h2{
  font-size:clamp(1.5rem,3.5vw,1.85rem);font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,var(--red-bright),var(--gold-light));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:16px;animation:fadeInUp 0.6s 0.35s var(--ease-out-expo) both;
}
.side-text{
  font-size:0.92rem;color:var(--text-muted);line-height:1.85;
  max-width:400px;margin:0 auto;animation:fadeInUp 0.6s 0.45s var(--ease-out-expo) both;
}

/* ── Product Cards ── */
.product-card{
  background:var(--bg-card);border-radius:var(--radius-xl);
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:0 4px 24px rgba(0,0,0,0.3);
  margin-bottom:20px;overflow:hidden;
  animation:fadeInUp 0.6s var(--ease-out-expo) both;
}
.product-card.primary{border-color:rgba(212,33,61,0.25);animation-delay:0.5s}
.product-card.secondary{border-color:rgba(201,169,110,0.15);animation-delay:0.65s}

.card-badge{
  display:inline-block;padding:6px 16px;font-size:0.72rem;font-weight:700;
  border-radius:20px;letter-spacing:2px;margin:20px 0 0 20px;
}
.primary-badge{background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;box-shadow:0 2px 12px var(--red-glow)}
.secondary-badge{background:transparent;color:var(--gold);border:1px solid rgba(201,169,110,0.3)}

.product-img-wrap{
  position:relative;width:100%;height:240px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 70% 80% at 50% 50%,rgba(212,33,61,0.06) 0%,transparent 70%);
  overflow:hidden;
}
.product-img-wrap::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:60px;
  background:linear-gradient(transparent,var(--bg-card));
}
.product-img-wrap img{
  max-width:70%;max-height:80%;object-fit:contain;
  transition:transform 0.5s var(--ease-out-expo);
  position:relative;z-index:1;
}
.product-img-wrap img:hover{transform:scale(1.06)}
.img-placeholder{
  width:130px;height:180px;border-radius:var(--radius-md);
  background:linear-gradient(135deg,rgba(255,255,255,0.03),rgba(255,255,255,0.05));
  border:1px dashed rgba(255,255,255,0.1);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:0.85rem;
}

.product-info{padding:16px 24px 28px;position:relative}
.product-info h3{font-size:1.2rem;font-weight:700;margin-bottom:4px;letter-spacing:1px}
.product-info .product-desc{font-size:0.85rem;color:var(--text-muted);margin-bottom:14px}
.product-info .product-reason{
  font-size:0.9rem;color:#ccc;line-height:1.75;
  padding:14px 18px;background:rgba(255,255,255,0.02);
  border-radius:var(--radius-md);border-left:3px solid var(--red);
}
.secondary .product-reason{border-left-color:var(--gold)}

/* ── Actions ── */
.result-actions{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.result-actions button{
  flex:1;min-width:140px;padding:15px 20px;
  font-family:inherit;font-size:0.92rem;font-weight:600;border-radius:60px;
  cursor:pointer;transition:all 0.35s var(--ease-out-expo);letter-spacing:1px;
}
.btn-retry{
  background:transparent;color:var(--text);border:1.5px solid rgba(255,255,255,0.15);
}
.btn-retry:hover{border-color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.04);transform:translateY(-2px)}
.btn-retry:active{transform:scale(0.96)}
.btn-share{
  background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;border:none;
  box-shadow:0 4px 20px var(--red-glow);
}
.btn-share:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(212,33,61,0.45)}
.btn-share:active{transform:scale(0.96)}

.particles{position:fixed;inset:0;pointer-events:none;z-index:0}

/* ── Toast ── */
.toast{
  position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(120px);
  background:rgba(44,44,46,0.95);color:#fff;padding:14px 30px;border-radius:60px;
  font-size:0.88rem;font-weight:500;z-index:999;opacity:0;
  transition:all 0.4s var(--ease-spring);pointer-events:none;white-space:nowrap;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.1);letter-spacing:0.5px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.footer-note{text-align:center;margin-top:36px;font-size:0.75rem;color:var(--text-dim);letter-spacing:1px}
.footer-note span{color:var(--red);font-weight:600}

/* ═══════════════════════════════════════════
   KEYFRAMES
   ═══════════════════════════════════════════ */
@keyframes fadeInUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ═══════════════════════════════════════════
   CONFETTI
   ═══════════════════════════════════════════ */
.confetti-piece{
  position:fixed;pointer-events:none;z-index:100;
  animation:confetti-fall var(--fall-dur) linear forwards;
}
@keyframes confetti-fall{
  0%{transform:translateY(-10vh) rotate(0deg);opacity:1}
  100%{transform:translateY(105vh) rotate(var(--spin));opacity:0}
}

/* ═══════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════ */
@media(max-width:480px){
  html{font-size:15px}
  body{padding:12px 12px 40px}
  .welcome .logo-ring{width:84px;height:84px}
  .welcome .logo-inner{width:68px;height:68px;font-size:32px}
  .welcome h1{letter-spacing:1.5px}
  .question-card{padding:24px 16px}
  .option-btn{padding:15px 16px;font-size:0.9rem}
  .option-btn .opt-letter{width:26px;height:26px;font-size:0.7rem;margin-right:10px}
  .product-img-wrap{height:190px}
  .product-info{padding:12px 18px 22px}
  .result-actions{flex-direction:column}
  .result-actions button{width:100%}
  .btn-start{padding:15px 40px;font-size:0.98rem}
}
</style>
</head>
<body>

<!-- Animated background orbs -->
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="particles" id="particles"></div>

<div class="container">

  <!-- ═══════ WELCOME ═══════ -->
  <section class="welcome" id="welcome">
    <div class="logo-wrap">
      <div class="logo-ring">
        <div class="logo-dot"></div>
        <div class="logo-dot"></div>
        <div class="logo-dot"></div>
        <div class="logo-inner">赤</div>
      </div>
    </div>
    <p class="tagline">CHIWEI RED TECH</p>
    <h1>赤尾红科技<br>让爱在探索中增进</h1>
    <p class="subtitle">40 个内心选择，找到专属于你的那一款<br><em>科技让爱更贴近</em></p>
    <button class="btn-start" onclick="startQuiz()">开启探索<span class="arrow">→</span></button>
  </section>

  <!-- ═══════ QUIZ ═══════ -->
  <section class="quiz-area" id="quizArea">
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:2.5%"></div></div>
      <span class="progress-num" id="progressNum">1/40</span>
      <span class="progress-icon" id="progressIcon">✦</span>
    </div>
    <div class="question-card" id="questionCard">
      <div class="question-number">QUESTION <span id="qIndex">1</span></div>
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsWrap"></div>
    </div>
  </section>

  <!-- ═══════ RESULT ═══════ -->
  <section class="result-area" id="resultArea">
    <div class="result-header">
      <span class="crown">⚬</span>
      <h2>你的赤尾灵魂之选</h2>
      <p class="side-text" id="sideText"></p>
    </div>
    <div id="primaryCard"></div>
    <div id="secondaryCard"></div>
    <div class="result-actions">
      <button class="btn-retry" onclick="restartQuiz()">再测一次</button>
      <button class="btn-share" onclick="shareResult()">分享我的灵魂搭档</button>
    </div>
    <p class="footer-note">赤尾 <span>红科技</span> · 中国智造 · 科技让爱更贴近</p>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  PRODUCT DATA
// ═══════════════════════════════════════════════════════════
const productMap = {

//  STATE
// ═══════════════════════════════════════
const scores = [0,0,0,0,0,0,0,0];
let currentQ = 0;
const TOTAL = questions.length;
const imageBase = "16个产品/";
const imgExt = id => (id === 16 || id === 13) ? ".PNG" : ".JPG";

// ═══════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════
const $ = id => document.getElementById(id);

function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2400);
}

function addRipple(e, btn){
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
  btn.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
}

// ═══════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════
function spawnConfetti(){
  const colors = ['#D4213D','#E83952','#C9A96E','#DFC896','#fff','#ff6b81','#ffd700'];
  const container = $('particles');
  for(let i = 0; i < 60; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const c = colors[Math.floor(Math.random() * colors.length)];
    const w = 6 + Math.random() * 8;
    const h = w * (0.4 + Math.random() * 1.6);
    piece.style.cssText = `
      left:${Math.random()*100}%;top:-5%;
      width:${w}px;height:${h}px;background:${c};border-radius:${Math.random()>0.5?'50%':'2px'};
      --fall-dur:${2+Math.random()*3}s;--spin:${(Math.random()-0.5)*720}deg;
      animation-delay:${Math.random()*1.5}s;
    `;
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 4000);
  }
}

// ═══════════════════════════════════════
//  QUIZ FLOW
// ═══════════════════════════════════════
function startQuiz(){
  for(let i=0;i<8;i++)scores[i]=0;
  currentQ=0;
  $('welcome').style.display='none';
  $('resultArea').classList.remove('active');
  $('resultArea').style.display='none';
  $('quizArea').classList.add('active');
  $('quizArea').style.display='block';
  renderQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderQuestion(){
  const qData = questions[currentQ];
  $('questionText').textContent = qData.q;
  $('qIndex').textContent = currentQ + 1;
  $('progressNum').textContent = (currentQ+1)+'/'+TOTAL;
  $('progressFill').style.width = ((currentQ+1)/TOTAL*100)+'%';
  const icons = ['✦','◇','○','△','▽','☆','◈','⬡','◉','⊕'];
  $('progressIcon').textContent = icons[currentQ % icons.length];

  const wrap = $('optionsWrap');
  wrap.innerHTML = '';
  ['a','b'].forEach((opt,idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    const letter = document.createElement('span');
    letter.className = 'opt-letter';
    letter.textContent = opt.toUpperCase();
    btn.appendChild(letter);
    const text = document.createElement('span');
    text.className = 'opt-text';
    text.textContent = qData[opt];
    btn.appendChild(text);
    btn.addEventListener('click', e => {
      addRipple(e, btn);
      selectAnswer(idx, btn);
    });
    wrap.appendChild(btn);
  });

  const card = $('questionCard');
  card.style.animation = 'none'; card.offsetHeight;
  card.style.animation = 'fadeInUp 0.4s var(--ease-out-expo) forwards';
}

function selectAnswer(optIdx, btnEl){
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btnEl.classList.add('selected');

  const dim = questions[currentQ].dim;
  if(optIdx === 0) scores[dim*2] += 1;
  else scores[dim*2+1] += 1;

  setTimeout(() => {
    currentQ++;
    if(currentQ >= TOTAL){
      showResult();
    }else{
      renderQuestion();
      $('quizArea').scrollIntoView({behavior:'smooth',block:'start'});
    }
  }, 350);
}

// ═══════════════════════════════════════
//  RESULT
// ═══════════════════════════════════════
function computeResult(){
  const c0 = scores[0] >= scores[1] ? 'A' : 'B';
  const c1 = scores[2] >= scores[3] ? 'C' : 'D';
  const c2 = scores[4] >= scores[5] ? 'E' : 'F';
  const c3 = scores[6] >= scores[7] ? 'G' : 'H';
  return productMap[c0+c1+c2+c3];
}

function showResult(){
  $('quizArea').classList.remove('active');
  $('quizArea').style.display='none';
  $('resultArea').classList.add('active');
  $('resultArea').style.display='block';

  const primary = computeResult();
  const secondary = productMap[Object.keys(productMap).find(k => productMap[k].id === primary.oppositeId)];

  $('sideText').textContent = primary.side;
  $('primaryCard').innerHTML = buildProductCard(primary, 'primary', '最适合你的赤尾款式');
  $('secondaryCard').innerHTML = buildProductCard(secondary, 'secondary', '偶尔一试');

  window.scrollTo({top:0,behavior:'smooth'});
  spawnConfetti();
}

function buildProductCard(product, type, badgeText){
  const badgeClass = type === 'primary' ? 'primary-badge' : 'secondary-badge';
  const reason = type === 'secondary'
    ? '翻转你的性格脚本，也许你会发现全新的愉悦维度。'
    : product.reason;
  const imgSrc = imageBase + product.id + imgExt(product.id);
  const imgHtml = `<img src="${imgSrc}" alt="${product.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="img-placeholder" style="display:none">产品 ${product.id}</div>`;
  return `<div class="product-card ${type}"><span class="card-badge ${badgeClass}">${badgeText}</span><div class="product-img-wrap">${imgHtml}</div><div class="product-info"><h3>${product.name}</h3><p class="product-desc">${product.desc}</p><p class="product-reason">${reason}</p></div></div>`;
}

// ═══════════════════════════════════════
//  SHARE & RESTART
// ═══════════════════════════════════════
function restartQuiz(){
  $('resultArea').classList.remove('active');
  $('resultArea').style.display='none';
  $('welcome').style.display='block';
  for(let i=0;i<8;i++)scores[i]=0;
  currentQ=0;
  window.scrollTo({top:0,behavior:'smooth'});
}

function shareResult(){
  const primary = computeResult();
  const shareText = `我在「赤尾红科技」性格测试中，找到了我的灵魂之选——${primary.name}。${primary.side} 来做你的专属测试：`;
  if(navigator.share){
    navigator.share({title:'赤尾红科技 · 灵魂之选',text:shareText}).catch(()=>{});
  }else{
    navigator.clipboard.writeText(shareText).then(()=>{
      showToast('✓ 已复制分享文案到剪贴板');
    }).catch(()=>{
      showToast('分享文案：'+shareText);
    });
  }
}
